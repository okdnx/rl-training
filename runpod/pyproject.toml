[project]
name = "rl-practice-runpod"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "torch==2.15.0",
    "transformers==5.22.2",
    "trl[peft]==1.17.1",
    "peft==0.21.2",
    "datasets==5.1.0",
    "accelerate==1.15.0",
    "safetensors==0.8.0",
    "huggingface-hub==2.4.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu132", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true
